<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Doomsday</title>
    <style>
      :root {
        --bg: #070b10;
        --panel: rgba(18, 26, 33, 0.8);
        --panel-border: rgba(255, 255, 255, 0.1);
        --text: #edf5ff;
        --muted: #a4b3c1;
        --danger: #ff5d5d;
        --accent: #7dd3fc;
        --accent-2: #a7f3d0;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: radial-gradient(circle at top, #0f1720, var(--bg) 50%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .game-wrap {
        position: relative;
        width: min(92vw, 920px);
        height: min(92vh, 620px);
        border: 1px solid var(--panel-border);
        border-radius: 18px;
        background: rgba(10, 14, 18, 0.9);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #0d1115;
        image-rendering: pixelated;
      }

      .hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .topbar {
        position: absolute;
        top: 16px;
        left: 16px;
        right: 16px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 12px;
        padding: 10px 12px;
        backdrop-filter: blur(6px);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
      }

      .stat {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .value {
        color: var(--text);
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .boss-hud {
        position: absolute;
        top: 72px;
        left: 50%;
        transform: translateX(-50%);
        width: min(52vw, 420px);
        padding: 8px 10px 10px;
        display: none;
      }

      .boss-label {
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #ffc7c7;
        margin-bottom: 6px;
      }

      .boss-bar {
        width: 100%;
        height: 10px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 999px;
        overflow: hidden;
      }

      .boss-fill {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, #ff5d5d, #ff8a8a);
        border-radius: 999px;
      }

      .controls {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 18px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
      }

      .move-pad {
        display: flex;
        flex-wrap: wrap;
        width: 150px;
        gap: 8px;
        pointer-events: auto;
      }

      .move-btn, .action-btn {
        border: 1px solid var(--panel-border);
        background: rgba(255,255,255,0.04);
        color: var(--text);
        border-radius: 12px;
        font-weight: bold;
        min-width: 54px;
        min-height: 48px;
        touch-action: manipulation;
      }

      .move-btn {
        flex: 1 0 28%;
      }

      .action-btn {
        min-width: 92px;
        min-height: 52px;
      }

      .right-actions {
        display: flex;
        gap: 10px;
        pointer-events: auto;
      }

      .center-msg {
        position: absolute;
        inset: 50% auto auto 50%;
        transform: translate(-50%, -50%);
        display: none;
        background: rgba(7, 11, 16, 0.82);
        border: 1px solid var(--panel-border);
        border-radius: 12px;
        padding: 18px 20px;
        min-width: min(80vw, 340px);
        text-align: center;
      }

      .center-msg.show { display: block; }

      .center-msg h2 {
        margin: 0 0 8px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 18px;
      }

      .center-msg p {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.6;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      @media (max-width: 620px) {
        .topbar {
          gap: 8px;
          flex-direction: column;
        }

        .controls {
          align-items: flex-end;
        }
      }
    </style>
  </head>
  <body>
    <div class="game-wrap">
      <canvas id="gameCanvas" width="900" height="620"></canvas>

      <div class="hud">
        <div class="topbar">
          <div class="panel stat">
            <span>Health</span>
            <span class="value" id="healthValue">100</span>
          </div>

          <div class="panel stat">
            <span>Ammo</span>
            <span class="value" id="ammoValue">12</span>
          </div>

          <div class="panel stat">
            <span>Score</span>
            <span class="value" id="scoreValue">0</span>
          </div>

          <div class="panel stat">
            <span>Zone</span>
            <span class="value" id="zoneValue">S-CENTER</span>
          </div>
        </div>

        <div class="boss-hud panel" id="bossHud">
          <div class="boss-label">Boss</div>
          <div class="boss-bar">
            <div class="boss-fill" id="bossHealthFill"></div>
          </div>
        </div>

        <div class="center-msg show" id="messageBox">
          <h2>Doomsday</h2>
          <p>Move with WASD or the touch pad. Tap shoot to survive the night.</p>
        </div>

        <div class="controls">
          <div class="move-pad">
            <div></div>
            <button class="move-btn" data-key="w">W</button>
            <div></div>
            <button class="move-btn" data-key="a">A</button>
            <button class="move-btn" data-key="s">S</button>
            <button class="move-btn" data-key="d">D</button>
          </div>

          <div class="right-actions">
            <button class="action-btn" id="shootBtn">Shoot</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const healthValue = document.getElementById('healthValue');
      const ammoValue = document.getElementById('ammoValue');
      const scoreValue = document.getElementById('scoreValue');
      const zoneValue = document.getElementById('zoneValue');
      const messageBox = document.getElementById('messageBox');
      const bossHud = document.getElementById('bossHud');
      const bossHealthFill = document.getElementById('bossHealthFill');

      const keys = {};
      const touchState = { w: false, a: false, s: false, d: false };
      const mapCenter = { x: canvas.width / 2, y: canvas.height / 2 };
      const zoneScale = 22;
      const zoneDefinitions = [
        { name: 'S-CENTER', distMax: 9.5, tint: 'rgba(155, 45, 45, 0.38)', voice: 'Ring wall holding. Boss zone ahead.' },
        { name: 'INDUSTRIAL', distMax: 17.5, tint: 'rgba(70, 110, 155, 0.34)', voice: 'Warehouses. Cold steel and dead silence.' },
        { name: 'MARKET', distMax: 26.5, tint: 'rgba(168, 123, 52, 0.30)', voice: 'Stalls and wreckage. The market is full of noise.' },
        { name: 'SLUMS', distMax: Infinity, tint: 'rgba(153, 118, 72, 0.28)', voice: 'The shacks are packed. Keep moving.' }
      ];

      const player = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 18,
        speed: 3.2,
        health: 100,
        ammo: 12,
        medkits: 0,
        fuel: 0,
        fireCooldown: 0,
        score: 0
      };

      const boss = {
        active: false,
        defeated: false,
        x: mapCenter.x,
        y: mapCenter.y - 160,
        radius: 42,
        maxHealth: 1400,
        health: 1400,
        speed: 1.15,
        attackCooldown: 0,
        spawnCooldown: 9,
        gateClosed: false,
        rise: 0,
        baseY: mapCenter.y - 160
      };

      const goldCache = {
        active: false,
        x: 0,
        y: 0,
        radius: 14,
        ammo: 60,
        medkits: 2,
        fuel: 3
      };

      const bullets = [];
      const enemies = [];
      let lastTime = 0;
      let wave = 1;
      let gameOver = false;
      let started = false;
      let currentZoneName = 'S-CENTER';
      let zoneNoticeTimer = 0;

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function getDistanceFromCenter() {
        return Math.hypot(player.x - mapCenter.x, player.y - mapCenter.y) / zoneScale;
      }

      function getCurrentZone() {
        const dist = getDistanceFromCenter();
        for (let i = 0; i < zoneDefinitions.length; i++) {
          const zone = zoneDefinitions[i];
          if (dist < zone.distMax) {
            return zone;
          }
        }
        return zoneDefinitions[zoneDefinitions.length - 1];
      }

      function showZoneNotice(zoneName) {
        const zone = zoneDefinitions.find((entry) => entry.name === zoneName) || zoneDefinitions[0];
        messageBox.classList.add('show');
        messageBox.innerHTML = '<h2>' + zone.name + '</h2><p>' + zone.voice + '</p>';
        zoneNoticeTimer = 2.6;
      }

      function updateBossHud() {
        if (boss.active && !boss.defeated) {
          bossHud.style.display = 'block';
          bossHealthFill.style.width = (boss.health / boss.maxHealth) * 100 + '%';
        } else {
          bossHud.style.display = 'none';
        }
      }

      function updateZoneState() {
        const zone = getCurrentZone();
        if (zone.name !== currentZoneName) {
          currentZoneName = zone.name;
          zoneValue.textContent = currentZoneName;
          showZoneNotice(currentZoneName);
        }
        zoneValue.textContent = currentZoneName;

        if (currentZoneName === 'S-CENTER' && !boss.active && !boss.defeated) {
          startBoss();
        }
      }

      function spawnEnemy() {
        const edge = Math.floor(Math.random() * 4);
        const zone = getCurrentZone();
        const tier = zoneDefinitions.indexOf(zone);
        const hpBoost = 45 * tier;
        const speedBoost = 0.09 * tier;
        let x = 0;
        let y = 0;

        if (edge === 0) {
          x = Math.random() * canvas.width;
          y = -30;
        } else if (edge === 1) {
          x = canvas.width + 30;
          y = Math.random() * canvas.height;
        } else if (edge === 2) {
          x = Math.random() * canvas.width;
          y = canvas.height + 30;
        } else {
          x = -30;
          y = Math.random() * canvas.height;
        }

        enemies.push({
          x,
          y,
          radius: 14 + Math.random() * 8,
          speed: 0.7 + wave * 0.16 + Math.random() * 0.4 + speedBoost,
          health: 1 + wave * 0.3 + (hpBoost / 45)
        });
      }

      function spawnBossMinions() {
        if (!boss.active || boss.defeated) return;
        for (let i = 0; i < 3; i++) {
          const angle = (Math.PI * 2 / 3) * i + (Math.random() - 0.5) * 0.5;
          const radius = 36 + Math.random() * 28;
          enemies.push({
            x: boss.x + Math.cos(angle) * radius,
            y: boss.y + Math.sin(angle) * radius,
            radius: 14 + Math.random() * 6,
            speed: 1.1 + wave * 0.08 + Math.random() * 0.2,
            health: 1.2 + wave * 0.5
          });
        }
      }

      function updateHud() {
        healthValue.textContent = Math.max(0, Math.ceil(player.health));
        ammoValue.textContent = player.ammo;
        scoreValue.textContent = player.score;
      }

      function resetGame() {
        player.x = canvas.width / 2;
        player.y = canvas.height / 2;
        player.health = 100;
        player.ammo = 12;
        player.medkits = 0;
        player.fuel = 0;
        player.score = 0;
        wave = 1;
        bullets.length = 0;
        enemies.length = 0;
        boss.active = false;
        boss.defeated = false;
        boss.gateClosed = false;
        boss.health = boss.maxHealth;
        boss.x = mapCenter.x;
        boss.y = boss.baseY;
        boss.rise = 0;
        boss.attackCooldown = 0;
        boss.spawnCooldown = 9;
        goldCache.active = false;
        gameOver = false;
        started = true;
        currentZoneName = 'S-CENTER';
        zoneNoticeTimer = 0;
        zoneValue.textContent = currentZoneName;
        messageBox.classList.remove('show');
        updateBossHud();

        for (let i = 0; i < 6; i++) {
          spawnEnemy();
        }

        updateHud();
      }

      function fireBullet() {
        if (gameOver || player.ammo <= 0 || player.fireCooldown > 0) return;

        player.ammo -= 1;
        player.fireCooldown = 0.18;

        const targetX = player.x + (Math.random() - 0.5) * 24;
        const targetY = player.y + (Math.random() - 0.5) * 24;
        const angle = Math.atan2(targetY - player.y, targetX - player.x);

        bullets.push({
          x: player.x,
          y: player.y,
          vx: Math.cos(angle) * 7,
          vy: Math.sin(angle) * 7,
          radius: 5
        });

        updateHud();
      }

      function handleInput() {
        if (!started) return;

        let dx = 0;
        let dy = 0;

        if (keys.w || touchState.w) dy -= 1;
        if (keys.s || touchState.s) dy += 1;
        if (keys.a || touchState.a) dx -= 1;
        if (keys.d || touchState.d) dx += 1;

        if (dx !== 0 || dy !== 0) {
          const len = Math.hypot(dx, dy) || 1;
          player.x += (dx / len) * player.speed;
          player.y += (dy / len) * player.speed;
        }

        player.x = clamp(player.x, player.radius, canvas.width - player.radius);
        player.y = clamp(player.y, player.radius, canvas.height - player.radius);
      }

      function applyBossSeals() {
        if (!boss.active || !boss.gateClosed) return;
        const dist = getDistanceFromCenter();
        const sealRadius = 9.5;
        if (dist > sealRadius) {
          const dx = player.x - mapCenter.x;
          const dy = player.y - mapCenter.y;
          const distance = Math.hypot(dx, dy) || 1;
          const nx = dx / distance;
          const ny = dy / distance;
          const maxDistance = sealRadius * zoneScale;
          player.x = mapCenter.x + nx * (maxDistance - 4);
          player.y = mapCenter.y + ny * (maxDistance - 4);
        }
      }

      function updateBullets() {
        for (let i = bullets.length - 1; i >= 0; i--) {
          const bullet = bullets[i];
          bullet.x += bullet.vx;
          bullet.y += bullet.vy;

          if (bullet.x < -20 || bullet.x > canvas.width + 20 || bullet.y < -20 || bullet.y > canvas.height + 20) {
            bullets.splice(i, 1);
          }
        }
      }

      function updateEnemies() {
        for (let i = enemies.length - 1; i >= 0; i--) {
          const enemy = enemies[i];
          const dx = player.x - enemy.x;
          const dy = player.y - enemy.y;
          const dist = Math.hypot(dx, dy) || 1;

          enemy.x += (dx / dist) * enemy.speed;
          enemy.y += (dy / dist) * enemy.speed;

          const splash = enemy.radius + player.radius;
          if (dist < splash) {
            player.health -= 0.8;
            if (player.health <= 0) {
              gameOver = true;
              zoneNoticeTimer = 0;
              messageBox.classList.add('show');
              messageBox.innerHTML = '<h2>Game Over</h2><p>Tap shoot to restart survival.</p>';
            }
          }
        }
      }

      function defeatBoss() {
        boss.active = false;
        boss.defeated = true;
        boss.gateClosed = false;
        goldCache.active = true;
        goldCache.x = boss.x;
        goldCache.y = boss.y;
        player.score += 250;
        messageBox.classList.add('show');
        messageBox.innerHTML = '<h2>Boss Down</h2><p>Gold cache unlocked. Gates reopen.</p>';
        zoneNoticeTimer = 3.0;
        updateBossHud();
      }

      function pickupGoldCache() {
        if (!goldCache.active) return;
        const dist = Math.hypot(player.x - goldCache.x, player.y - goldCache.y);
        if (dist < player.radius + goldCache.radius + 6) {
          player.ammo += goldCache.ammo;
          player.medkits += goldCache.medkits;
          player.fuel += goldCache.fuel;
          goldCache.active = false;
          messageBox.classList.add('show');
          messageBox.innerHTML = '<h2>Cache Looted</h2><p>+60 rounds, +2 meds, +3 fuel.</p>';
          zoneNoticeTimer = 2.4;
        }
      }

      function startBoss() {
        if (boss.active || boss.defeated) return;
        boss.active = true;
        boss.gateClosed = true;
        boss.health = boss.maxHealth;
        boss.x = mapCenter.x;
        boss.y = boss.baseY;
        boss.rise = 0;
        boss.attackCooldown = 0.5;
        boss.spawnCooldown = 9;
        messageBox.classList.add('show');
        messageBox.innerHTML = '<h2>S-CENTER BOSS</h2><p>The arena seals. Keep moving.</p>';
        zoneNoticeTimer = 2.8;
        updateBossHud();
      }

      function updateBoss(dt) {
        if (!boss.active || boss.defeated) return;

        boss.attackCooldown = Math.max(0, boss.attackCooldown - dt);
        boss.spawnCooldown = Math.max(0, boss.spawnCooldown - dt);

        if (boss.rise < 1) {
          boss.rise += dt * 0.8;
        }

        const bossSpeed = boss.speed * (boss.health < boss.maxHealth * 0.4 ? 1.35 : 1.0);
        const dx = player.x - boss.x;
        const dy = player.y - boss.y;
        const dist = Math.hypot(dx, dy) || 1;

        boss.x += (dx / dist) * bossSpeed * dt * 60;
        boss.y += (dy / dist) * bossSpeed * dt * 60;

        if (dist < boss.radius + player.radius + 8 && boss.attackCooldown <= 0) {
          const damage = 18 + Math.random() * 10;
          player.health -= damage;
          boss.attackCooldown = 1.4;
          if (player.health <= 0) {
            gameOver = true;
            messageBox.classList.add('show');
            messageBox.innerHTML = '<h2>Game Over</h2><p>Tap shoot to restart survival.</p>';
          }
        }

        if (boss.spawnCooldown <= 0) {
          spawnBossMinions();
          boss.spawnCooldown = 9;
        }

        if (boss.health <= 0) {
          defeatBoss();
        }
      }

      function checkCollisions() {
        for (let i = bullets.length - 1; i >= 0; i--) {
          const bullet = bullets[i];

          if (boss.active && !boss.defeated) {
            const dx = bullet.x - boss.x;
            const dy = bullet.y - boss.y;
            const dist = Math.hypot(dx, dy);
            if (dist < bullet.radius + boss.radius) {
              bullets.splice(i, 1);
              boss.health -= 1;
              if (boss.health <= 0) {
                defeatBoss();
              }
              continue;
            }
          }

          for (let j = enemies.length - 1; j >= 0; j--) {
            const enemy = enemies[j];
            const dx = bullet.x - enemy.x;
            const dy = bullet.y - enemy.y;
            const dist = Math.hypot(dx, dy);

            if (dist < bullet.radius + enemy.radius) {
              bullets.splice(i, 1);
              enemy.health -= 1;

              if (enemy.health <= 0) {
                enemies.splice(j, 1);
                const currentZoneTier = zoneDefinitions.indexOf(getCurrentZone());
                player.score += 10 + currentZoneTier * 2;
                player.ammo = Math.min(99, player.ammo + 6 * currentZoneTier);

                if (player.score > 0 && player.score % 100 === 0) {
                  wave += 1;
                  for (let k = 0; k < 3 + wave; k++) {
                    spawnEnemy();
                  }
                }
              }

              break;
            }
          }
        }
      }

      function handleSpawning() {
        if (enemies.length < 5 + wave) {
          spawnEnemy();
        }
      }

      function update(dt) {
        if (!started) return;

        handleInput();
        updateZoneState();
        applyBossSeals();
        updateHud();

        if (zoneNoticeTimer > 0) {
          zoneNoticeTimer = Math.max(0, zoneNoticeTimer - dt);
          if (zoneNoticeTimer === 0 && !gameOver) {
            messageBox.classList.remove('show');
          }
        }

        if (!gameOver) {
          player.fireCooldown = Math.max(0, player.fireCooldown - dt);

          if (player.ammo < 12 && Math.random() < 0.006) {
            player.ammo = Math.min(12, player.ammo + 1);
          }

          updateBullets();
          updateEnemies();
          updateBoss(dt);
          checkCollisions();
          handleSpawning();
          pickupGoldCache();
        }
      }

      function drawZoneOverlay() {
        const zone = getCurrentZone();
        ctx.fillStyle = zone.tint;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.lineWidth = 1.25;

        const ringDistances = [9.5, 17.5, 26.5].map((value) => value * zoneScale);
        ringDistances.forEach((radius) => {
          ctx.beginPath();
          ctx.arc(mapCenter.x, mapCenter.y, radius, 0, Math.PI * 2);
          ctx.stroke();
        });

        ctx.strokeStyle = 'rgba(255,255,255,0.32)';
        ctx.beginPath();
        ctx.arc(mapCenter.x, mapCenter.y, 10.2 * zoneScale, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(mapCenter.x, mapCenter.y, 11.2 * zoneScale, 0, Math.PI * 2);
        ctx.stroke();

        for (let i = 0; i < 16; i++) {
          const rx = (i * 80 + 40) % canvas.width;
          const ry = (i * 40 + 60) % canvas.height;
          if (zone.name === 'INDUSTRIAL') {
            ctx.fillStyle = 'rgba(120, 138, 160, 0.22)';
            ctx.fillRect(rx, ry, 60, 34);
          } else if (zone.name === 'MARKET') {
            ctx.fillStyle = 'rgba(180, 140, 80, 0.18)';
            ctx.fillRect(rx, ry, 46, 28);
            ctx.fillStyle = 'rgba(255, 228, 160, 0.08)';
            ctx.fillRect(rx + 6, ry + 6, 14, 12);
          } else if (zone.name === 'SLUMS') {
            ctx.fillStyle = 'rgba(120, 75, 40, 0.16)';
            ctx.fillRect(rx, ry, 38, 24);
            ctx.fillStyle = 'rgba(255, 180, 90, 0.08)';
            ctx.fillRect(rx + 7, ry + 5, 10, 8);
          } else {
            ctx.fillStyle = 'rgba(180, 50, 50, 0.10)';
            ctx.fillRect(rx, ry, 58, 22);
          }
        }
      }

      function drawBoss() {
        if (!boss.active || boss.defeated) return;
        const riseOffset = (1 - boss.rise) * 80;
        const drawY = boss.y + riseOffset;

        ctx.fillStyle = '#8d0d0d';
        ctx.beginPath();
        ctx.arc(boss.x, drawY, boss.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fca5a5';
        ctx.fillRect(boss.x - 24, drawY - boss.radius - 18, 48, 6);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(boss.x - 24, drawY - boss.radius - 18, 48 * (boss.health / boss.maxHealth), 6);
      }

      function drawGoldCache() {
        if (!goldCache.active) return;
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.moveTo(goldCache.x, goldCache.y - goldCache.radius);
        ctx.lineTo(goldCache.x + goldCache.radius, goldCache.y);
        ctx.lineTo(goldCache.x, goldCache.y + goldCache.radius);
        ctx.lineTo(goldCache.x - goldCache.radius, goldCache.y);
        ctx.closePath();
        ctx.fill();
      }

      function drawMinimap() {
        const startX = canvas.width - 150;
        const startY = 18;
        const size = 96;

        ctx.fillStyle = 'rgba(7, 11, 16, 0.72)';
        ctx.fillRect(startX, startY, size, size);
        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.strokeRect(startX, startY, size, size);

        const rings = [0.9, 1.6, 2.4];
        rings.forEach((scale) => {
          ctx.beginPath();
          ctx.arc(startX + size / 2, startY + size / 2, (size / 2) * scale, 0, Math.PI * 2);
          ctx.stroke();
        });

        ctx.fillStyle = '#7dd3fc';
        ctx.beginPath();
        ctx.arc(startX + size / 2, startY + size / 2, 4, 0, Math.PI * 2);
        ctx.fill();

        const playerMapX = startX + size / 2 + ((player.x - mapCenter.x) / (canvas.width / 2)) * (size / 2);
        const playerMapY = startY + size / 2 + ((player.y - mapCenter.y) / (canvas.height / 2)) * (size / 2);

        ctx.fillStyle = '#fef3c7';
        ctx.beginPath();
        ctx.arc(playerMapX, playerMapY, 4, 0, Math.PI * 2);
        ctx.fill();

        if (boss.active && !boss.defeated) {
          const bossX = startX + size / 2 + ((boss.x - mapCenter.x) / (canvas.width / 2)) * (size / 2);
          const bossY = startY + size / 2 + ((boss.y - mapCenter.y) / (canvas.height / 2)) * (size / 2);
          ctx.fillStyle = '#ff5d5d';
          ctx.beginPath();
          ctx.arc(bossX, bossY, 4, 0, Math.PI * 2);
          ctx.fill();
        }

        if (goldCache.active) {
          const cacheX = startX + size / 2 + ((goldCache.x - mapCenter.x) / (canvas.width / 2)) * (size / 2);
          const cacheY = startY + size / 2 + ((goldCache.y - mapCenter.y) / (canvas.height / 2)) * (size / 2);
          ctx.fillStyle = '#facc15';
          ctx.beginPath();
          ctx.arc(cacheX, cacheY, 3, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = 'rgba(255, 120, 120, 0.7)';
        for (const enemy of enemies) {
          const ex = startX + size / 2 + ((enemy.x - mapCenter.x) / (canvas.width / 2)) * (size / 2);
          const ey = startY + size / 2 + ((enemy.y - mapCenter.y) / (canvas.height / 2)) * (size / 2);
          ctx.beginPath();
          ctx.arc(ex, ey, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawBackground() {
        const grd = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grd.addColorStop(0, '#0a1015');
        grd.addColorStop(1, '#05090c');
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        drawZoneOverlay();

        for (let i = 0; i < 40; i++) {
          const x = (i * 71 + (Date.now() * 0.02) % 100) % canvas.width;
          const y = (i * 47 + (Date.now() * 0.03) % 100) % canvas.height;
          ctx.fillStyle = 'rgba(255,255,255,0.03)';
          ctx.fillRect(x, y, 2, 2);
        }
      }

      function drawPlayer() {
        ctx.fillStyle = '#7dd3fc';
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#dbeafe';
        ctx.fillRect(player.x - 3, player.y - 3, 6, 6);
      }

      function drawBullets() {
        ctx.fillStyle = '#fef3c7';
        for (const bullet of bullets) {
          ctx.beginPath();
          ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawEnemies() {
        for (const enemy of enemies) {
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#fee2e2';
          ctx.fillRect(enemy.x - enemy.radius, enemy.y - enemy.radius - 8, enemy.radius * 2, 5);
          ctx.fillStyle = '#22c55e';
          ctx.fillRect(enemy.x - enemy.radius, enemy.y - enemy.radius - 8, enemy.radius * 2 * clamp(enemy.health / 2, 0, 1), 5);
        }
      }

      function render() {
        drawBackground();
        drawBullets();
        drawEnemies();
        drawBoss();
        drawGoldCache();
        drawPlayer();
        drawMinimap();
      }

      function tick(timestamp) {
        const dt = Math.min(0.032, (timestamp - lastTime) / 1000 || 0.016);
        lastTime = timestamp;

        update(dt);
        render();
        requestAnimationFrame(tick);
      }

      window.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();
        keys[key] = true;

        if (event.key === ' ') {
          event.preventDefault();
          fireBullet();
        }

        if (key === 'r') {
          player.ammo = 12;
        }
      });

      window.addEventListener('keyup', (event) => {
        const key = event.key.toLowerCase();
        keys[key] = false;
      });

      document.getElementById('shootBtn').addEventListener('click', () => {
        if (!started) resetGame();
        fireBullet();
      });

      document.querySelectorAll('.move-btn').forEach((btn) => {
        const key = btn.dataset.key;

        const press = (value) => {
          touchState[key] = value;
          if (!started && value) resetGame();
        };

        btn.addEventListener('pointerdown', () => press(true));
        btn.addEventListener('pointerup', () => press(false));
        btn.addEventListener('pointerleave', () => press(false));
        btn.addEventListener('pointercancel', () => press(false));
      });

      window.addEventListener('pointerdown', () => {
        if (!started) resetGame();
      });

      // S-CENTER boss: arena seal, boss waves, and gold cache reward.
      currentZoneName = 'S-CENTER';
      zoneValue.textContent = currentZoneName;
      resetGame();
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
